name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build
        run: gradle build --no-daemon

      - name: Sprawdz jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          unzip -l "$JAR"
          unzip -l "$JAR" | grep -q fabric.mod.json
          unzip -l "$JAR" | grep -q AutoRerollClient.class
          mkdir -p out
          cp "$JAR" out/autoreroll.jar

      - name: Release z samym jarem
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mod-latest
          name: AutoReroll (najnowszy build)
          files: out/autoreroll.jar
